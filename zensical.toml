[project]
site_name = "TTbarHadronic Documentation"
site_description = "Presentation and meeting documentation for the all-hadronic ttbar analysis"
site_url = "https://mandalaritra1.github.io/doc-ttbarhad/"
docs_dir = "docs"
site_dir = "site-zensical"
extra_css = ["stylesheets/extra.css"]
extra_javascript = [
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]
nav = [
    { "Overview" = "index.md" },
    { "Guide" = [
        { "Updating This Site" = "guide/getting-started.md" },
        { "Figure Checklist" = "guide/visual-check.md" },
        { "Repositories and Coding" = "guide/repositories-and-coding.md" },
    ] },
    { "Analysis" = [
        { "Introduction" = "analysis/introduction.md" },
        { "Phase Space" = "analysis/phase-space.md" },
        { "Datasets" = "analysis/datasets.md" },
        { "Selections" = "analysis/selections.md" },
        { "Data/MC Validation" = "analysis/datamc-validation.md" },
        { "Corrections and Uncertainties" = [
            { "Systematic Uncertainties" = "analysis/uncertainties.md" },
            { "Top-pT Reweighting" = "analysis/top-pt-reweighting.md" },
            { "Top-Tag Scale Factors" = "analysis/top-tag-scale-factors.md" },
        ] },
        { "Background Estimation" = "analysis/background-estimation.md" },
        { "Results" = "analysis/results.md" },
    ] },
    { "Archive" = [
        { "About the Archive" = "archive/index.md" },
        { "June 2026 (2024 only)" = [
            { "Front Page" = "archive/2026-06/index.md" },
            { "Introduction" = "archive/2026-06/introduction.md" },
            { "Phase Space" = "archive/2026-06/phase-space.md" },
            { "Datasets" = "archive/2026-06/datasets.md" },
            { "Selections" = "archive/2026-06/selections.md" },
            { "Data/MC Validation" = "archive/2026-06/datamc-validation.md" },
            { "Background Estimation (2024 F-test)" = "archive/2026-06/background-estimation.md" },
            { "Results (2024 expected limits)" = "archive/2026-06/results.md" },
            { "Recombination Top-Tagger" = "archive/2026-06/recomb-top-tagger.md" },
        ] },
    ] },
    { "Meetings" = [
        { "Recents" = "meetings/recents.md" },
        { "Archive" = "meetings/all.md" },
    ] },
]

[project.theme]
variant = "modern"
favicon = "assets/images/favicon.jpg"
features = [
    "navigation.tabs",
    "navigation.sections",
    "content.code.copy"
]

[[project.theme.palette]]
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "green"
accent = "light-green"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
logo = "lucide/atom"
